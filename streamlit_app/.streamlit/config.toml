[theme]
base = "light"

# Brand & Interface Colors
primaryColor = "#0D9488"
backgroundColor = "#FAFCFC"
secondaryBackgroundColor = "#F0F7F7"
textColor = "#0F172A"

# Clean UI font for headers, buttons, and navigation
font = "'Plus Jakarta Sans':https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"

# JetBrains Mono for flight codes, booking IDs, prices, and code blocks
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap"
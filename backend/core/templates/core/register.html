{% extends 'core/base.html' %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="center"><div class="card narrow">
  <h2 style="margin-top:0">Register as a client</h2>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post">{% csrf_token %}
    <label>Full name <input name="full_name" required></label>
    <label>Phone <input name="phone" required></label>
    <label>Password (at least 8 characters) <input name="password" type="password" required></label>
    <label>National ID <input name="national_id" required></label>
    <label>Date of birth <input name="date_of_birth" type="date"></label>
    <label>Address <input name="address"></label>
    <button type="submit">Register</button>
  </form>
  <p><a href="{% url 'login' %}">Back to log in</a></p>
</div></div>
{% endblock %}

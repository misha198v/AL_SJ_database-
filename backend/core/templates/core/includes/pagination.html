<div class="table-footer"><span>{% if count %}Showing {{ page.start_index }}–{{ page.end_index }} of {{ count }}{% else %}0 records{% endif %}</span><nav class="pagination" aria-label="Table pages">{% if previous_url %}<a class="btn btn-outline btn-sm" href="{{ previous_url }}">Previous</a>{% else %}<button class="btn btn-outline btn-sm" disabled type="button">Previous</button>{% endif %}<span class="page-number" aria-current="page">{{ page.number }}</span>{% if next_url %}<a class="btn btn-outline btn-sm" href="{{ next_url }}">Next</a>{% else %}<button class="btn btn-outline btn-sm" disabled type="button">Next</button>{% endif %}</nav></div>

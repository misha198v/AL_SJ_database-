{% load ui %}<div class="search-field">{% icon 'search' %}<label class="visually-hidden" for="table-search">Search {{ search_label|default:"records" }}</label><input id="table-search" type="search" name="q" value="{{ query }}" placeholder="{{ search_placeholder|default:'Search records…' }}" autocomplete="off">{% if query %}<button class="clear-search" type="button" data-clear-search="table-search" onclick="ALsJUI.clearSearch(this)" aria-label="Clear search">{% icon 'close' %}</button>{% endif %}</div>
